<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="192x192" href="public/icons/icon-192.png">
  <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#fbe3b4">
  <title>Kail: ticket market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/site.css">
</head>
<body class="harbour">
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="./"><img class="px" data-icon="hook" data-k="2" alt="">Kail</a>
      <nav aria-label="Main">
        <a href="harbour">Harbour</a>
        <a href="tickets" aria-current="page">Tickets</a>
        <a href="week">Week</a>
        <a class="btn primary small" href="play">Play now</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wide market">
    <h1>Ticket market</h1>
    <p class="lead">Tickets are traded here for NEAR, between players. A ticket is one chance in the daily draw, and it never expires.</p>
    <div class="strip" id="stats" aria-live="off"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="mgrid">
      <section class="panel flat" aria-label="The market">
        <div class="tabs" role="tablist" aria-label="What to show" id="tabs"></div>
        <div class="tools" id="tools"></div>
        <div id="sweep"></div>
        <div class="table" id="list" role="tabpanel" tabindex="0"></div>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
      </section>

      <aside class="side">
        <section class="panel flat" aria-labelledby="h-new">
          <h2 id="h-new">Place an order</h2>
          <div class="switch" role="tablist" aria-label="Kind of order">
            <button type="button" role="tab" data-way="sell" aria-selected="true">Sell tickets</button>
            <button type="button" role="tab" data-way="bid" aria-selected="false">Offer to buy</button>
          </div>
          <form class="mform" id="order" novalidate>
            <div class="field">
              <label for="amount">How many tickets</label>
              <div class="inline"><button class="btn small" type="button" data-step="-1" aria-label="Fewer">−</button><input id="amount" inputmode="numeric" value="1" autocomplete="off"><button class="btn small" type="button" data-step="1" aria-label="More">+</button><button class="btn small" type="button" id="max">All</button></div>
            </div>
            <div class="field">
              <label for="price">NEAR for each ticket</label>
              <input id="price" inputmode="decimal" value="" placeholder="NEAR" autocomplete="off">
              <div class="quick" id="quick"></div>
            </div>
            <div class="sum" id="sum"></div>
            <p class="err" id="err" role="alert"></p>
            <button class="btn primary" type="submit" id="submit">Put up for sale</button>
            <p class="note" id="orderNote"></p>
          </form>
        </section>
        <section class="panel flat" aria-labelledby="h-book">
          <h2 id="h-book">Order book</h2>
          <div class="depth" id="depth"></div>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="src/tickets.js"></script>
</body>
</html>
